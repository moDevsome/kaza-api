services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kaza_api_sources
    restart: unless-stopped
    volumes:
      - ./:/var/www/
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=dev
    networks:
      - dev_api_network
    depends_on:
      - mysql

  caddy:
    image: caddy:latest
    container_name: kaza_api_dev_http_server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/public
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dev_api_network
    depends_on:
      - php
    extra_hosts:
      - "kaza-api.localhost:host-gateway"

  mysql:
    image: mysql:8.0
    container_name: kaza_api_dev_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=kaza_api_dev_db
      - MYSQL_USER=kaza_api
      - MYSQL_PASSWORD=secret
    volumes:
      - dev_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - dev_api_network

volumes:
  dev_db_data:
  caddy_data:
  caddy_config:

networks:
  dev_api_network:
    driver: bridge